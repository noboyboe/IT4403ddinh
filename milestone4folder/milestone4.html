<!DOCTYPE html>
<html lang="en">

<head>
  <title>Milestone 4</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
  <link rel="stylesheet" href="style3.css">
</head>

<body>

  <script id="moviesCard_temp" type="x-tmpl-mustache">
{{#movies}}
  <div class="movie {{viewMode}}" data-id="{{id}}">
    <img src="{{poster}}" />
    <div class="movie-info">
      <h3>{{title}}</h3>
      <p>Released: {{release_date}}</p>
      <p>Rating: {{vote_average}}</p>
    </div>
  </div>
{{/movies}}
</script>

<script id="detail_temp" type="x-tmpl-mustache">
  <img src="{{poster}}" />
  <h2>{{title}}</h2>
  <p>{{overview}}</p>
  <p>Released: {{release_date}}</p>
  <p>Rating: {{vote_average}}</p>
</script>

<script id="pagination_temp" type="x-tmpl-mustache">
  {{#pages}}
    <button class="pagebutton" data-page="{{.}}">{{.}}</button>
  {{/pages}}
</script>
  
  <div class="header">
    <h1>The Movie Database</h1>
    <p>(Improved SPA UI)</p>
    <h2>Search For Movies</h2>
    <input type="text" id="userinput" placeholder="Enter keywords...">
    <button id="searchbutton">Search</button>
<!-- All movie information can be seen in this div -->
  <div class="content">
    <div class="up_sect">
      <h2>Upcoming</h2>
      <div id="upcoming"></div>
    </div>
    <h2>Search results for:</h2>
    <div id="searchTitle"></div>
    <div id="resultsCount"></div>
    <div class="options">
      <div class="pageDiv">
        <div id="pagination"></div>
      </div>
      <div class="view-toggle">
        <button id="gridView">Grid View</button>
        <button id="listView">List View</button>
      </div>
    </div>
    <div id="results"></div>
    <div id="pageCount"></div>
    <div id="movieInfo"></div>
  </div>

   <div class="footer">
    <p>Milestone 4 Assignment is ran by TMDB (The Movie Database) API</p>
  </div>

  <script>
    const api_key = "0ecdfc6e4a77a70994012b68270a5ecf";
    const url = "https://api.themoviedb.org/3";
    const image = "https://image.tmdb.org/t/p/w200";

    let current_page = 1;
    let current_view = "grid";

// This function provides information on the first 20 upcoming movies

    function moviesCard(movies){
      return movies.map(movie => ({
        id: movie.id,
        title: movie.title,
        release_date: movie.release_date,
        vote_average: movie.vote_average,
        poster: image + movie.poster_path
      }));
    }

    $(document).ready(function () {
    $.get(`${url}/movie/upcoming?api_key=${api_key}`, function (data) {
        let upcomingMovies = data.results.slice(0, 20);
        render("#upcoming", upcomingMovies);
    });
});

    $("#searchbutton").click(function() {
      current_page = 1;
      let query = $("#userinput").val();

      $("#searchTitle").text(`"${query}"`);
      $("#pageCount").text(`Page ${current_page}`);

      display(current_page);
      pagination();
      layout();
  });

    function display(page_num) {
      let query = $("#userinput").val();

      $.get(`${url}/search/movie?api_key=${api_key}&query=${query}&page=${page_num}`, function(data) {
        let pageItems = data.results.slice(0, 10);
        render("#results", pageItems);
        $("#resultsCount").text(`Found ${data.total_results} results`);
      });
    }

    function render(container, movies) {
      const temp = $("#moviesCard_temp").html();
      const formatted = movies.map(movie => ({
        ...moviesCard([movie])[0],
        viewMode: current_view === "grid" ? "grid-item" : "list-item"
    }));

  const rendered = Mustache.render(temp, {movies: formatted});
  $(container).html(rendered);
      if (container === "#results") {
        $(container)
          .removeClass("grid list")
          .addClass(current_view)
      }
      
  setTimeout(() => {
    $(".movie").addClass("show");
  }, 50);
}

function layout() {
  $("#gridView").click(function() {
    current_view = "grid";
    display(current_page);
  });

  $("#listView").click(function() {
    current_view = "list";
    display(current_page);
  });
}
    function pagination() {
      const temp = $("#pagination_temp").html();
      const pages = [1,2,3,4,5];
      const rendered = Mustache.render(temp, {pages});

      $("#pagination").html(rendered);
    }

    $(document).on("click", ".pagebutton", function() {
      current_page = $(this).data("page");
      display(current_page);

      $("#pageCount").text(`Page ${current_page}`);
    });

    $(document).on("click", ".movie", function() {
      let movieId = $(this).data("id");

      $.get(`${url}/movie/${movieId}?api_key=${api_key}`, function(movie){
        const temp = $("#detail_temp").html();
        const formatted = {
          title: movie.title,
          overview: movie.overview,
          release_date: movie.release_date,
          vote_average: movie.vote_average,
          poster: image + movie.poster_path
        };

        const rendered = Mustache.render(temp, formatted);
        $("#movieInfo").html(rendered);
      });
    });
      
  </script>

</body>
</html>
