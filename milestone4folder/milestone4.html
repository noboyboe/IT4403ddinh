<!DOCTYPE html>
<html lang="en">

<head>
  <title>Milestone 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles4.css">
</head>

<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1">The Movie Database</span>
  <div class="input-group w-50 mx-auto">
    <input type="text" id="userinput" class="form-control" placeholder="Enter keywords...">
    <button id="searchbutton" class="btn btn-primary">Search</button>
  </div>
</nav>
<!-- These are mustache templates that display movie details.-->
<script id="moviesCard_temp" type="x-tmpl-mustache">
{{#movies}}
  <div class="col">
    <div class="card h-100 movie {{viewMode}}" data-id="{{id}}">
      <img src="{{poster}}" class="card-img-top" />
      <div class="card-body">
        <h6 class="card-title">{{title}}</h6>
        <p class="card-text">Released: {{release_date}}</p>
        <p class="card-text">Rating: {{vote_average}}</p>
      </div>
    </div>
  </div>
{{/movies}}
</script>

<script id="detail_temp" type="x-tmpl-mustache">
  <div class="card">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="{{poster}}" class="img-fluid rounded-start" />
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{title}}</h5>
          <p class="card-text">{{overview}}</p>
          <p class="card-text"><small>Released: {{release_date}}</small></p>
          <p class="card-text"><small>Rating: {{vote_average}}</small></p>
        </div>
      </div>
    </div>
  </div>
</script>

<script id="pagination_temp" type="x-tmpl-mustache">
  {{#pages}}
    <button class="btn btn-outline-primary pagebutton" data-page="{{.}}">
      {{.}}
    </button>
  {{/pages}}
</script>

<!-- All movie information can be seen in this div -->
  <div class="content">
    <div class="up_sect">
      <h2>Upcoming</h2>
      <div id="upcoming"></div>
    </div>
    <h2>Search results for:</h2>
    <div id="searchTitle"></div>
    <div id="resultsCount"></div>
    <div class="options">
      <div class="pageDiv">
        <div class="d-flex justify-content-center align-items-center gap-3 flex-wrap" id="topControls">
          <div id="pagination"></div>
          <button id="tableView" class="btn btn-outline-light">Table</button>
        </div>
      </div>
      <div class="view-toggle text-center my-3">
        <button id="gridView" class="btn btn-outline-light">Grid View</button>
        <button id="listView" class="btn btn-outline-light">List View</button>
      </div>
    </div>
    <div id="results" class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3"></div>
    <div class="modal fade" id="movieModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
          <div class="modal-content p-3" id="movieInfo"></div>
        </div>
    </div>
    <div class="container my-4">
      <div class="modal fade" id="tableModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content p-3">
            <h4 class="mb-3">Search Results Table</h4>
            <table class="table table-dark table-striped">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Release Date</th>
                  <th>Rating</th>
                </tr>
              </thead>
              <tbody id="resultsTable"></tbody>
            </table>

          </div>

    </div>
  </div>
   <div class="footer">
    <p>Milestone 4 Assignment is ran by TMDB (The Movie Database) API</p>
  </div>

  <script>
    const api_key = "0ecdfc6e4a77a70994012b68270a5ecf";
    const url = "https://api.themoviedb.org/3";
    const image = "https://image.tmdb.org/t/p/w200";
    let current_page = 1;
    let current_view = "grid";
    $(".options").hide();
    $("#tableView").hide();
    $("#gridView").hide();
    $("#listView").hide();
// This function provides information on the first 20 upcoming movies

    function moviesCard(movies){
      return movies.map(movie => ({
        id: movie.id,
        title: movie.title,
        release_date: movie.release_date,
        vote_average: movie.vote_average,
        poster: image + movie.poster_path
      }));
    }
// Movies are sliced into 10 movies and are split into 2 different pages
    $(document).ready(function () {
    $.get(`${url}/movie/upcoming?api_key=${api_key}`, function (data) {
        let upcomingMovies = data.results.slice(0, 20);
        render("#upcoming", upcomingMovies);
    });
});
// Provides a page counter so the code knows which page it needs to display
    $("#searchbutton").click(function() {
      current_page = 1;
      let query = $("#userinput").val();

      $("#searchTitle").text(`"${query}"`);

      display(current_page);
      pagination();
// When a user presses a button, it is highlighted to signal the user what view they are on.
      $("#gridView").addClass("active");
      $("#listView").removeClass("active");
  });
// 
    function display(page_num) {
      let query = $("#userinput").val();
// Upon pressing the search button, the website refers to the API to collect data.
      $.get(`${url}/search/movie?api_key=${api_key}&query=${query}&page=${page_num}`, function(data) {
        let pageItems = data.results.slice(0, 10);
        render("#results", pageItems);
        $("#resultsCount").text(`Found ${data.total_results} results`);

        if (data.total_results > 0) {
          $(".options").show();
          $("#tableView").show();
          $("#gridView").show();
          $("#listView").show();
        } else {
          $(".options").hide();
          $("#tableView").hide();
          $("#gridView").hide();
          $("#listView").hide();
        }
      });
    }
    function tableDisplay(page_num) {
      let query = $("#userinput").val();

      $.get(`${url}/search/movie?api_key=${api_key}&query=${query}&page=${page_num}`, function(data) {

        let tableHTML = data.results.slice(0, 10).map(movie => `
          <tr>
            <td>${movie.title}</td>
            <td>${movie.release_date}</td>
            <td>${movie.vote_average}</td>
          </tr>
        `).join("");

        $("#resultsTable").html(tableHTML);
      });
    }





//The movies are rendered to display the movies in an organized fashion.
    function render(container, movies) {
      const temp = $("#moviesCard_temp").html();
      const formatted = movies.map(movie => ({
        ...moviesCard([movie])[0],
        viewMode: current_view === "grid" ? "grid-item" : "list-item"
    }));

  const rendered = Mustache.render(temp, {movies: formatted});
  $(container).html(rendered);
      if (container === "#results") {
        $(container)
          .removeClass("grid list")
          .addClass(current_view)
      }
 //A slow animation that fades in and out as the user searches for new movies     
  setTimeout(() => {
    $(".movie").addClass("show");
  }, 50);

    if (container === "#results") {
      if (current_view === "list") {
        $(container).removeClass("row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3");
      } else {
        $(container).addClass("row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3");
      }
    }
  }
   //Functions when the user clicks on either 'Grid View' or 'List View' and the movies are organized differently 
  $(document).on("click", "#gridView", function() {
    current_view = "grid";
    $("#gridView").addClass("active");
    $("#listView").removeClass("active");

    display(current_page);
});

  $(document).on("click", "#listView", function() {
    current_view = "list";
    $("#listView").addClass("active");
    $("#gridView").removeClass("active");

    display(current_page);
});

  $(document).on("click", "#tableView", function() {
    tableDisplay(current_page);
    const modal = new bootstrap.Modal(document.getElementById('tableModal'));
    modal.show();
});
    //When the user clicks on a numbered button, it will change pages with a new set of movies.
    function pagination() {
      const temp = $("#pagination_temp").html();
      const pages = [1,2,3,4,5];
      const rendered = Mustache.render(temp, {pages});

      $("#pagination").html(rendered);
      $(`.pagebutton[data-page="${current_page}"]`).addClass("active");
    }
// Page buttons are also highlighted to signal the user what page they are on.
    $(document).on("click", ".pagebutton", function() {
      current_page = $(this).data("page");
      $(".pagebutton").removeClass("active");
      $(this).addClass("active");
      display(current_page);
      $("#pageCount").text(`Page ${current_page}`);
    });
// Clicking on a movie will popup with additional details about a movie at the bottom of the page.
    $(document).on("click", ".movie", function() {
      let movieId = $(this).data("id");

      $.get(`${url}/movie/${movieId}?api_key=${api_key}`, function(movie){
        const temp = $("#detail_temp").html();
        const formatted = {
          title: movie.title,
          overview: movie.overview,
          release_date: movie.release_date,
          vote_average: movie.vote_average,
          poster: image + movie.poster_path
        };

        const rendered = Mustache.render(temp, formatted);
        $("#movieInfo").html(rendered);

        const modal = new bootstrap.Modal(document.getElementById('movieModal'));
        modal.show();
      });
    });

  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
